[project]
name = "routebook-agent"
version = "0.1.0"
description = "RouteBook Agent modular monolith and learning prototypes"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.16,<2.0",
    "anthropic>=0.75,<1.0",
    "celery[redis]>=5.6,<6.0",
    "fastapi>=0.116,<1.0",
    "httpx>=0.28,<1.0",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-postgres>=3.0,<4.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "pydantic-settings>=2.10,<3.0",
    "python-dotenv>=1.0,<2.0",
    "redis>=6.2,<7.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.17,<2.0",
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=1.1,<2.0",
    "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires PostgreSQL and Redis",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "UP046"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
exclude = ["examples/"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true
