name: routebook-agent

x-api-environment: &api-environment
  APP_ENV: development
  LOG_LEVEL: INFO
  DATABASE_URL: postgresql+psycopg://routebook:routebook@postgres:5432/routebook
  LANGGRAPH_DATABASE_URL: postgresql://routebook:routebook@postgres:5432/routebook?options=-csearch_path%3Dlanggraph
  REDIS_URL: redis://redis:6379/1
  CELERY_BROKER_URL: redis://redis:6379/0
  API_CORS_ORIGINS: http://localhost:3000
  ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
  MODEL_ID: ${MODEL_ID:-claude-haiku-4-5}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  REQUIREMENT_PROMPT_VERSION: ${REQUIREMENT_PROMPT_VERSION:-requirement-extraction-v1}
  REQUIREMENT_MAX_ATTEMPTS: ${REQUIREMENT_MAX_ATTEMPTS:-2}
  REQUIREMENT_TIMEOUT_SECONDS: ${REQUIREMENT_TIMEOUT_SECONDS:-20}
  AMAP_API_KEY: ${AMAP_API_KEY:-}
  AMAP_BASE_URL: ${AMAP_BASE_URL:-https://restapi.amap.com}
  QWEATHER_API_KEY: ${QWEATHER_API_KEY:-}
  QWEATHER_API_HOST: ${QWEATHER_API_HOST:-}
  ZHIPU_MCP_API_KEY: ${ZHIPU_MCP_API_KEY:-}
  ZHIPU_WEB_SEARCH_MCP_URL: ${ZHIPU_WEB_SEARCH_MCP_URL:-https://open.bigmodel.cn/api/mcp/web_search_prime/mcp}
  ENRICHMENT_ENABLED: ${ENRICHMENT_ENABLED:-true}
  ENRICHMENT_MAX_SEARCH_REQUESTS: ${ENRICHMENT_MAX_SEARCH_REQUESTS:-12}
  ENRICHMENT_MAX_PLACES: ${ENRICHMENT_MAX_PLACES:-12}
  ENRICHMENT_MAX_RESULTS: ${ENRICHMENT_MAX_RESULTS:-5}
  ENRICHMENT_TIMEOUT_SECONDS: ${ENRICHMENT_TIMEOUT_SECONDS:-12}
  ENRICHMENT_CACHE_TTL_SECONDS: ${ENRICHMENT_CACHE_TTL_SECONDS:-604800}
  PROVIDER_CONNECT_TIMEOUT_SECONDS: ${PROVIDER_CONNECT_TIMEOUT_SECONDS:-3}
  PROVIDER_READ_TIMEOUT_SECONDS: ${PROVIDER_READ_TIMEOUT_SECONDS:-8}
  PROVIDER_MAX_ATTEMPTS: ${PROVIDER_MAX_ATTEMPTS:-2}
  PROVIDER_RETRY_BACKOFF_SECONDS: ${PROVIDER_RETRY_BACKOFF_SECONDS:-0.2}

x-api-image: &api-image
  build:
    context: .
    dockerfile: services/api/Dockerfile
  environment: *api-environment

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: routebook
      POSTGRES_USER: routebook
      POSTGRES_PASSWORD: routebook
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ keeps major-version-specific data below this directory.
      - routebook-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routebook -d routebook"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *api-image
    command: ["sh", "-c", "uv run alembic upgrade head && uv run python -m services.api.app.checkpoint_setup"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api-image
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *api-image
    command: ["uv", "run", "celery", "-A", "services.api.app.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:8000
        NEXT_PUBLIC_AMAP_JS_KEY: ${NEXT_PUBLIC_AMAP_JS_KEY:-}
        NEXT_PUBLIC_AMAP_SECURITY_CODE: ${NEXT_PUBLIC_AMAP_SECURITY_CODE:-}
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  routebook-postgres:
